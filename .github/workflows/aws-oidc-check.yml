name: AWS OIDC check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check-identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      EXPECTED_ROLE: fiapx-infra-github-actions
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PAGER: ''
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/fiapx-infra-github-actions$ ]]; then
            echo '::error::Configure AWS_ROLE_ARN with the expected pipeline role ARN.'
            exit 1
          fi
          printf '::add-mask::%s\n' "${BASH_REMATCH[1]}"
          printf 'EXPECTED_ACCOUNT=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          if [[ "$AWS_REGION" != 'us-east-1' ]]; then
            echo '::error::Configure AWS_REGION as us-east-1.'
            exit 1
          fi

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_ACCOUNT }}
          role-session-name: fiapx-oidc-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 2

      - name: Verify assumed identity
        shell: bash
        run: |
          set -euo pipefail
          identity="$(aws sts get-caller-identity --output json)"
          account="$(jq -r '.Account' <<< "$identity")"
          arn="$(jq -r '.Arn' <<< "$identity")"
          expected="arn:aws:sts::${EXPECTED_ACCOUNT}:assumed-role/${EXPECTED_ROLE}/fiapx-oidc-${GITHUB_RUN_ID}"
          if [[ "$account" != "$EXPECTED_ACCOUNT" || "$arn" != "$expected" ]]; then
            echo '::error::The assumed identity does not match the expected account and role.'
            exit 1
          fi
          echo 'OIDC authentication verified successfully.'
          {
            echo '### AWS OIDC authentication verified'
            echo ''
            echo 'This check does not validate S3 permissions or modify Terraform state.'
          } >> "$GITHUB_STEP_SUMMARY"
